<!doctype html>
<meta charset="utf-8">
<title>The intranet, by hand</title>
<style>
  :root { --ink:#1a1a1a; --muted:#6b6b6b; --rule:#d8d4ca; --bg:#f9f7f1;
          --blue:#2f6cb1; --red:#b8323a; --green:#4a8b6b; --amber:#c08a3e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; }
  header { border-bottom:1px solid var(--rule); padding:14px 22px;
           display:flex; gap:18px; align-items:baseline; flex-wrap:wrap; }
  h1 { font:500 19px/1.2 "Iowan Old Style",Palatino,Georgia,serif; margin:0; }
  .sub { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns:210px 1fr 300px; gap:0; min-height:calc(100vh - 58px); }
  nav, aside { padding:18px; }
  nav { border-right:1px solid var(--rule); }
  aside { border-left:1px solid var(--rule); }
  section { padding:22px 26px; min-width:0; }
  h2 { font:500 15px/1.3 "Iowan Old Style",Palatino,Georgia,serif; margin:0 0 10px;
       text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-size:11px; }
  button { font:inherit; background:#fff; color:var(--ink); border:1px solid var(--rule);
           border-radius:4px; padding:6px 10px; cursor:pointer; text-align:left; }
  button:hover:not(:disabled) { border-color:var(--blue); color:var(--blue); }
  button:disabled { opacity:.4; cursor:default; }
  .sitebtn { display:block; width:100%; margin-bottom:6px; }
  .sitebtn.here { border-color:var(--blue); color:var(--blue); font-weight:600; }
  .pagetitle { font:500 22px/1.25 "Iowan Old Style",Palatino,Georgia,serif; margin:0 0 4px; }
  .crumb { color:var(--muted); font-size:12.5px; margin-bottom:14px; }
  .body p { margin:0 0 7px; }
  .body .row { font-variant-numeric:tabular-nums; }
  .links { margin-top:16px; padding-top:12px; border-top:1px solid var(--rule); }
  .links button { display:block; margin-bottom:6px; }
  .q { font:500 17px/1.4 "Iowan Old Style",Palatino,Georgia,serif; margin:0 0 12px; }
  .steps { font-size:13px; color:var(--muted); margin-bottom:14px; }
  .steps b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .steps.low b { color:var(--red); }
  input[type=text] { font:inherit; width:100%; padding:7px 9px; border:1px solid var(--rule);
                     border-radius:4px; background:#fff; color:var(--ink); }
  .navrow { display:flex; gap:8px; margin-bottom:16px; }
  .log { margin-top:16px; font-size:12.5px; color:var(--muted); }
  .log div { padding:1px 0; font-family:"SF Mono",Menlo,monospace; }
  .verdict { margin-top:14px; padding:12px; border:1px solid var(--rule); border-radius:4px;
             background:#fff; }
  .verdict .big { font:500 26px/1 "Iowan Old Style",Palatino,Georgia,serif; }
  .win { color:var(--green); } .lose { color:var(--red); } .part { color:var(--amber); }
  .note { font-size:12.5px; color:var(--muted); margin-top:8px; }
  select { font:inherit; padding:5px; border:1px solid var(--rule); border-radius:4px; background:#fff; }
</style>

<header>
  <h1>The intranet, by hand</h1>
  <span class="sub">Answer the question in 12 actions. Same corpus, same budget,
  same scorer the agent gets.</span>
  <span style="flex:1"></span>
  <select id="qpick"></select>
</header>

<main>
  <nav>
    <h2>Sites</h2>
    <div id="tree"></div>
    <div class="log" id="log"></div>
  </nav>

  <section>
    <div class="navrow">
      <button id="prev">&larr; prev</button>
      <button id="next">next &rarr;</button>
    </div>
    <div id="page"></div>
  </section>

  <aside>
    <h2>Your question</h2>
    <p class="q" id="question"></p>
    <p class="steps" id="steps"></p>
    <h2>Answer</h2>
    <input type="text" id="ans" placeholder="type your answer, then Enter" autocomplete="off">
    <div id="verdict"></div>
  </aside>
</main>

<script>
const DATA = {"sites": [{"key": "people", "name": "People and Teams", "blurb": "Teams, reporting lines, joining, absence and working hours.", "pages": [{"title": "Welcome to People and Teams", "body": ["Everything about teams, cost centres, joining, time off and working hours lives here.", "New joiners should start with the first week page.", "The team directory is the page most people come back to: it maps every team and group to the building or the site it sits in and to the cost centre it books to.", "Use Who leads what when a rule, a policy or a form names a role rather than a person.", "Signature levels and signatories turns a signature level into the person who holds it.", "This site is maintained by Operations and is reviewed once a year.", "Purchasing rules, room bookings, laboratory access and IT accounts are not held here; each has its own site in the side pane."], "links": [{"label": "Team directory", "site": "people", "page": 2}, {"label": "Signature levels and signatories", "site": "people", "page": 4}, {"label": "Who leads what", "site": "people", "page": 3}]}, {"title": "How we are organised", "body": ["Three divisions: Instruments, Embedded Systems and Operations.", "Quality is a staff function and reports to the Managing Director.", "Instruments covers the product lines and the customers who buy them.", "Embedded Systems writes firmware and keeps the source repositories; which group owns which repository is recorded on the IT site.", "Operations covers facilities, health and safety, purchasing and the policy site.", "A division is led by a head; a team or a group is led by a line manager.", "Where a team sits and which cost centre it books to are in the team directory, not here.", "Reporting lines change with the annual planning round, and the directory is corrected at the same time."], "links": []}, {"title": "Team directory", "body": ["Vega team: Building Nord, floor 2, cost centre K2210.", "Orion team: Building Sued, floor 2, cost centre K2240.", "Embedded Systems group: Building West, floor 1, cost centre K3100.", "Metrology group: Building Nord, floor 0, cost centre K4120.", "Field service: Winterthur site, cost centre K5000.", "Each entry gives the building or the site a team sits in and the cost centre it books to, and nothing else.", "The cost centre is the code that time recording and purchase orders are booked against.", "Line managers are not listed here; ask inside your team, or use Who leads what for a division head.", "Desk moves are arranged with facilities management, and this page is corrected afterwards."], "links": [{"label": "The Winterthur site", "site": "facilities", "page": 3}, {"label": "Who leads what", "site": "people", "page": 3}]}, {"title": "Who leads what", "body": ["Managing Director: Elke Rovinsky.", "Head of Operations: Marek Duval.", "Head of Instruments: Ana Ferreira.", "Head of Embedded Systems: Rui Okonkwo.", "Head of Quality: Petra Lindqvist.", "Policies, rules and forms name the role and not the person, so use this page to turn a title into a name.", "A head runs a division and sets its plan for the year; day to day questions belong with your line manager.", "Deputies stand in while a head is away and are named in the address book.", "Signing authority is set by signature level, not by title; the levels and the people who hold them are listed on the signature page."], "links": [{"label": "Signature levels and signatories", "site": "people", "page": 4}]}, {"title": "Signature levels and signatories", "body": ["Level A: Elke Rovinsky.", "Level B: Marek Duval.", "Level C: Ana Ferreira.", "Level D: Rui Okonkwo.", "Level E: Petra Lindqvist.", "Each signature level is held by one person, and the table above is the whole list.", "The procurement policy sets which level is needed, and the thresholds are not repeated here because they are reviewed far more often than the signatories change.", "Send the document to the signatory the policy points at, not to your division head.", "A signatory who is away is covered by the deputy named in the address book."], "links": [{"label": "Purchase approvals", "site": "policies", "page": 1}]}, {"title": "Your first week", "body": ["Day one: collect your badge at reception, then pick up your laptop from IT.", "Your buddy walks you through the intranet and the time recording tool.", "Reception takes the photograph for your badge and issues it while you wait.", "A badge opens the offices you need on day one; laboratory access is requested separately by your line manager and is granted room by room.", "Your line manager sets up the week: a tour of the building, the team meeting, the cost centre you book time to and the time recording rules.", "Ask the buddy for anything that is missing on day one, from a docking station to a headset; a repair later on is a ticket for the service desk.", "The first week ends with a short review with your line manager."], "links": [{"label": "Badges and access", "site": "facilities", "page": 6}]}, {"title": "Absence and leave", "body": ["25 days of holiday a year, booked in the time recording system and approved by your line manager.", "Report sickness to your line manager before the start of core hours.", "A doctor's note is needed for a longer absence and is sent to your line manager.", "Holiday is approved in the order the requests arrive, and the whole team's holiday is visible to the team.", "Unpaid leave, parental leave and a sabbatical are agreed with your line manager and confirmed by the head of the division.", "Public holidays follow the canton a site is in, so the Winterthur site and the Zurich Nord campus differ by a few days each year.", "Nobody approves their own absence; it always goes to the line manager."], "links": []}, {"title": "Working hours and flexible time", "body": ["Core hours are 09:00 to 15:00, and hours are recorded daily in the time recording system.", "Overtime is compensated in time off, not in pay.", "Outside core hours the working day is yours to arrange with your line manager, as long as the team is covered.", "Working from home is agreed with your line manager and is not open to laboratory or assembly roles.", "Colleagues at the Winterthur site keep the same core hours as the campus.", "Travel between sites during the working day counts as working time; the timetable and the parking rules are on the facilities site.", "Duty outside office hours is not flexible time: it is covered by the on call rota that IT keeps for each system, and that rota names one person per system.", "Time corrections are approved by your line manager."], "links": [{"label": "On call rota", "site": "it", "page": 2}]}]}, {"key": "facilities", "name": "Facilities and Buildings", "blurb": "Buildings, floors, laboratories, badges, parking and the shuttle.", "pages": [{"title": "Facilities at a glance", "body": ["Facilities management looks after the buildings, the laboratories, the badge system, parking and the shuttle.", "Nordhelm Instruments AG works from the Zurich Nord campus and four other locations: the Duebendorf depot, the Rheinfelden works, the Winterthur site and the Zug office.", "The campus itself has three buildings, Nord, Sued and West.", "The lists on this site are the ones facilities management keeps and corrects, so a room code or a departure quoted in a mail or a slide is not authoritative.", "A broken lift, a door that will not close or a room that is too warm is reported to facilities management and not to the service desk.", "Room bookings for more than twenty people, furniture moves and anything that needs a key are handled here as well."], "links": [{"label": "The Winterthur site", "site": "facilities", "page": 3}, {"label": "Shuttle timetable", "site": "facilities", "page": 4}, {"label": "Badges and access", "site": "facilities", "page": 6}]}, {"title": "The Zurich Nord campus", "body": ["Building Nord holds reception, the training rooms and two floors of offices.", "Building Sued holds the canteen, the post room and the project rooms.", "Building West holds the workshop, the loading bay and the drawing archive.", "The laboratories are on the lower floors of Building West and are reached through the corridor behind the workshop.", "Every building has one coffee lounge. The room it is in is on the coffee lounges page and not here.", "Visitors sign in at reception, are given a visitor badge and are collected there by whoever invited them.", "Meeting rooms are booked in the room booking tool, and a booking that nobody claims is released after fifteen minutes."], "links": [{"label": "Coffee lounges by building", "site": "facilities", "page": 2}]}, {"title": "Coffee lounges by building", "body": ["One lounge per building and site, with the room it is in.", "Building Nord: N-310.", "Building Sued: S-121.", "Building West: W-204.", "Winterthur site: T-018.", "The lounges are open to everyone on site and are not bookable, so a lounge cannot be held for a meeting.", "Cups and plates belong in the trolleys on each floor and not on the tables in the lounges.", "A lounge that has run out is reported to facilities management rather than to the catering supplier.", "The machines are serviced once a month and the service dates are posted beside them."], "links": []}, {"title": "The Winterthur site", "body": ["The Winterthur site assembles the Kestrel humidity probes and holds the goods store.", "There is one building, with the assembly hall and the store on the ground floor and offices above.", "The site is about twenty minutes from the campus by road and is served by the works shuttle.", "Deliveries for the whole company arrive here first and are forwarded to the campus twice a week.", "Badges issued on the campus work here without a change of access class, and visitors are registered at the entrance in the same way.", "The release calendar for the line built here is kept by Product Engineering.", "Post for the site travels on the shuttle."], "links": [{"label": "Firmware release calendar", "site": "products", "page": 7}]}, {"title": "Shuttle timetable", "body": ["One departure per destination each working day, from the stop at the north entrance.", "Duebendorf depot: 06:45.", "Winterthur site: 07:20.", "Rheinfelden works: 13:55.", "Zug office: 16:10.", "Seats are booked the day before through facilities management, and a seat that is not claimed is released to the waiting list.", "The return departures are published at the stop and are not repeated here.", "The campus loop between the three buildings runs on its own timetable, which is posted in each entrance hall.", "A journey the shuttle does not cover is claimed as a travel expense."], "links": []}, {"title": "Parking and the shuttle", "body": ["Parking permits are requested through facilities management and are issued per person for one year.", "The barrier reads your badge, so nothing has to be displayed in the windscreen.", "The waiting list is longest for the underground spaces, and a permit that goes unused for a quarter is withdrawn.", "Visitors park in the marked bays in front of the main entrance and are registered at reception.", "Bicycles go in the covered racks at each building and not against the railings.", "Charging points for electric cars are on the lowest parking level and are for charging only, not for long stay parking.", "The shuttle to each of the other locations leaves from the north entrance, and the departures are on the shuttle timetable page."], "links": [{"label": "Badges and access", "site": "facilities", "page": 6}]}, {"title": "Badges and access", "body": ["Badges are issued at reception on the first working day and are collected in person.", "Badge readers and door groups are managed in Varda.", "Every laboratory door carries an access class, and the class a given room needs is listed on the access classes page.", "A class your badge does not carry is requested by your line manager and is granted room by room rather than floor by floor.", "Your badge is also your print release card and your canteen card.", "Report a lost badge to reception on the same day; the old badge is blocked at once.", "A door that refuses a badge it should accept is a fault in the system behind the door, and it goes to the support queue for that system."], "links": [{"label": "Access classes by laboratory", "site": "facilities", "page": 7}, {"label": "Support routing by system", "site": "it", "page": 1}]}, {"title": "Access classes by laboratory", "body": ["The class each laboratory door requires, by room code.", "L1-07: class Blue.", "L2-04: class Amber.", "L3-02: class Violet.", "CR-1: class Crimson.", "What a room is used for, and which group has booked it, is kept by that group and not on this page.", "A class is granted for one room at a time and lapses when you move to another group.", "Eating and drinking are not allowed in any of these rooms, and working alone in one needs a written agreement from your line manager.", "A door that opens for a badge that should not carry the class is reported the same day."], "links": []}]}, {"key": "it", "name": "IT Service Desk", "blurb": "Laptops, accounts, network, printing, software and the on call rota.", "pages": [{"title": "Contacting the service desk", "body": ["The service desk is the single point of contact for hardware, accounts, network and software.", "The desk is open 08:00 to 17:00 and the internal phone extension is 4000.", "Tickets can also be raised in the self service portal, which is faster for anything that is not stopping your work.", "Every ticket goes to a queue, and the queue depends on the system you were using.", "Name the system in the ticket, because a ticket that names no system is passed back for clarification.", "Outside office hours the on call rota applies, and the pager is carried by system rather than by queue.", "Engineering source control has its own page, and access to a repository is requested by your line manager.", "Hardware handovers and repairs are dealt with at the walk-in counter next to reception."], "links": [{"label": "Support routing by system", "site": "it", "page": 1}, {"label": "On call rota", "site": "it", "page": 2}, {"label": "Source control and firmware repositories", "site": "it", "page": 3}]}, {"title": "Support routing by system", "body": ["This table decides where a fault report goes, so quote the system name and nothing else.", "What each system is for is documented by the team that owns it, not here.", "Aletsch: queue Ahorn.", "Silvretta: queue Birke.", "Napf: queue Linde.", "Varda: queue Eiche.", "Zeitwerk: queue Ulme.", "A report sent to the wrong queue is moved by hand, which costs a working day.", "The queues share one duty roster over the summer, so a slow reply is normal then.", "Escalation runs through the queue owner and never through contacting an engineer directly."], "links": [{"label": "On call rota", "site": "it", "page": 2}]}, {"title": "On call rota", "body": ["Primary on call contact, by system, for the hours when the service desk is closed.", "The rota is reviewed every quarter and covers nights, weekends and public holidays.", "Aletsch: Tomas Rask.", "Silvretta: Sanna Ilves.", "Napf: Yuki Oberer.", "Varda: Dino Ravelli.", "Zeitwerk: Bruno Achterberg.", "Call the service desk number first, because the on call engineer is paged only after the call is logged.", "Anything still unanswered after 30 minutes escalates to the duty manager.", "Use the rota for a system that is down for everyone, not for a single laptop or a forgotten password."], "links": [{"label": "Contacting the service desk", "site": "it", "page": 0}]}, {"title": "Source control and firmware repositories", "body": ["Every product line keeps its firmware in its own repository, and the maintaining team owns the branch policy.", "Vega 3 firmware: maintained by the Vega team, repository vega3-fw.", "Orion 2 firmware: maintained by the Embedded Systems group, repository orion2-fw.", "Kestrel firmware: maintained by the Metrology group, repository kestrel-fw.", "Tarn 5 firmware: maintained by the Field service team, repository tarn5-fw.", "Read access is granted to any engineer on request, and write access follows the maintaining team.", "Changes are reviewed by a second engineer before they are merged, whichever repository they touch.", "Repository names carry no version and no date, so use the release calendar in product engineering for timing."], "links": [{"label": "Team directory", "site": "people", "page": 2}]}, {"title": "Accounts and passwords", "body": ["Every employee gets one account, and that account carries your mail, your files and your access to the systems.", "Your line manager requests an account for a new joiner two weeks before the start date.", "Passwords are changed once a year and never shared, not even with the service desk.", "A badge is not an account, and door access is requested separately through facilities.", "Accounts for external contractors expire on the end date in the contract and are not extended by the desk.", "An account that has not been used for 90 days is disabled, and reinstating it needs an approval from your line manager."], "links": [{"label": "Badges and access", "site": "facilities", "page": 6}]}, {"title": "Laptops and mobile phones", "body": ["The standard laptop is replaced every four years, and the replacement is triggered from the asset register.", "Two models are offered, a light portable and a heavier workstation for engineering software.", "A laptop outside the standard list is a purchase like any other and needs the signature the purchase policy asks for.", "The service desk cannot approve a purchase and never signs one off.", "Mobile phones sit on a separate contract, and a replacement handset is ordered by your line manager.", "For a repair, bring the device and its power supply to the walk-in counter, and expect to leave it overnight."], "links": [{"label": "Procurement and purchase approvals", "site": "policies", "page": 1}]}, {"title": "Software licences and renewals", "body": ["Software is licensed centrally, and a licence is assigned to a person rather than to a machine.", "A request for a licence is approved by your line manager and then raised with the supplier.", "Framework contracts with the software vendors are held by procurement, and the desk does not hold the renewal dates.", "A licence that is no longer used is returned at the next renewal, which keeps the count honest.", "Unlicensed software must not hold company data, and anything outside the catalogue is unsupported.", "Ask procurement before you promise a supplier anything in writing."], "links": [{"label": "Approved suppliers", "site": "policies", "page": 2}]}, {"title": "Network, wifi and printing", "body": ["The VPN client is installed on every managed laptop, and the sign in is confirmed on your phone once a working day.", "Personal devices do not receive VPN access.", "The wired network in the offices carries managed devices only, and a dark socket has usually been switched off at the patch panel.", "Guest wifi vouchers are issued at reception and last one working day.", "Printers stand on every floor and jobs are released with your badge, and anything not released within a day is deleted.", "If the reader on a printer does not respond, release the job with your account and password on the keypad instead."], "links": []}]}, {"key": "products", "name": "Product Engineering", "blurb": "Product lines, datasheets, firmware, calibration and test rigs.", "pages": [{"title": "Our product lines", "body": ["Product Engineering owns four instrument lines: Vega 3 pressure transmitters, Orion 2 flow meters, Kestrel humidity probes and Tarn 5 temperature probes.", "The three current lines have a page each, with ranges, applications and lead times.", "Tarn 5 is still supported and still built to order, but it is no longer actively sold, so it has no page of its own.", "Sensing elements and their suppliers are held together on one page rather than on the line pages, so that a change of supplier is recorded in one place.", "Release months for the firmware of all four lines are on the release calendar.", "Environmental testing, test rigs and calibration before dispatch are shared across the lines and have pages of their own."], "links": [{"label": "Sensing elements and suppliers", "site": "products", "page": 4}, {"label": "Test rigs and environmental testing", "site": "products", "page": 5}, {"label": "Firmware release calendar", "site": "products", "page": 7}]}, {"title": "Vega 3 pressure transmitters", "body": ["The Vega 3 is the current pressure transmitter line and replaces the earlier Vega 2.", "Ranges 0 to 40 bar, accuracy 0.05 percent of span.", "The housing is stainless steel and the standard output is 4 to 20 milliamperes.", "The Vega team owns the line and holds a design review every second week.", "A second source for the pressure cell was evaluated twice and was not approved, so the cell is bought under a framework contract.", "The supplier of the cell is on the sensing element page, and the account manager for that supplier is on the approved supplier list.", "Environmental testing for this line runs on the shared rigs and is described on the test rig page.", "Lead time is six weeks from order to dispatch."], "links": [{"label": "Sensing elements and suppliers", "site": "products", "page": 4}, {"label": "Approved suppliers", "site": "policies", "page": 2}]}, {"title": "Orion 2 flow meters", "body": ["The Orion 2 is the current flow meter line and covers water, coolant and light oils.", "Ranges 0.5 to 300 litres per minute.", "Wetted parts are stainless steel and a hygienic variant is available for food and beverage customers.", "The Orion team owns the line, and a customer specific range has to be confirmed by the product owner before it is quoted.", "Standard lead time is eight weeks, and longer for the hygienic variant.", "The flow element and the company that supplies it are on the sensing element page.", "Two failures returned from the field last quarter were traced to fitting and not to the meter, so the fitting instructions were rewritten."], "links": [{"label": "Sensing elements and suppliers", "site": "products", "page": 4}]}, {"title": "Kestrel humidity probes", "body": ["Kestrel probes are the smallest of the current lines and sell mainly to heating and ventilation customers.", "Ranges 0 to 100 percent relative humidity.", "The sensing film is sensitive to condensation, so probes stay in sealed bags with a desiccant until they are fitted.", "Volumes are lower than on the other lines, so the line is built in batches rather than continuously.", "The film and the company that supplies it are on the sensing element page.", "Drift is checked at every recalibration, and a probe that has drifted out of tolerance is replaced rather than adjusted.", "Probes are sold with a two year warranty, which is the same as the other lines."], "links": [{"label": "Calibration before dispatch", "site": "products", "page": 6}]}, {"title": "Sensing elements and suppliers", "body": ["Every line is built around one bought in sensing element, and this page is the only place where the element and its supplier are recorded together.", "Vega 3: KP-14 pressure cell, supplied by Talstrom Werke.", "Orion 2: FM-9 flow element, supplied by Roswitha Elektronik.", "Kestrel: HX-7 humidity film, supplied by Aalvik Components.", "Tarn 5: RT-3 thermistor, supplied by Brindl Metall.", "Nothing else on any line is bought from a single source, so a change here is a change to the line.", "Account managers, framework contracts and audit status are held by the policy pages and are not repeated here.", "A change of element or of supplier needs a qualification run and a new test report before the first delivery."], "links": [{"label": "Approved suppliers", "site": "policies", "page": 2}, {"label": "Framework contracts", "site": "policies", "page": 3}]}, {"title": "Test rigs and environmental testing", "body": ["The pressure rig and the flow bench are in the workshop and are booked in the shared calendar.", "A rig may not be left loaded overnight.", "Environmental tests for the Vega 3 run in the climate chamber, laboratory L2-04.", "A full sequence is temperature cycling, damp heat and vibration, and takes about ten working days.", "The chamber is also used by the Kestrel line, so book it early in a release week.", "Laboratory doors are opened with a badge, and the access class a room needs is set by the room and not by the test, so check the facilities page before you book.", "Test reports are filed with the release documents and are quoted in customer qualification packs."], "links": [{"label": "Access classes by laboratory", "site": "facilities", "page": 7}, {"label": "Calibration before dispatch", "site": "products", "page": 6}]}, {"title": "Calibration before dispatch", "body": ["Every instrument is calibrated before dispatch and again after a return from the field, and the field service team books the return calibrations.", "A calibration takes about half a day for a standard instrument.", "Bring the instrument with its serial number, because work without one cannot be recorded.", "Each measurement is entered as it is taken and the certificate is signed once the run is complete; the system that holds them is named in the calibration policy and not here.", "Reference standards are recalibrated externally once a year and carry their own certificates.", "A witnessed calibration for a customer is arranged with the product owner and adds about two days.", "The laboratory is run by the Metrology group, and questions about the record systems go to the service desk."], "links": [{"label": "Calibration and measurement records", "site": "policies", "page": 4}, {"label": "On call rota", "site": "it", "page": 2}]}, {"title": "Firmware release calendar", "body": ["Firmware for each line is released once a year, in the month shown here.", "Vega 3: March.", " const ARTICLES = new Set(DATA.articles);
const SITES = DATA.sites, QUERIES = DATA.queries, MAX = DATA.max_steps;

// The scorer, matching intranet.py: lowercase, split on non alphanumerics, drop articles.
function toks(t) {
  if (t == null) return [];
  return t.toLowerCase().split(/[^a-z0-9]+/).filter(x => x && !ARTICLES.has(x));
}
function f1(pred, gold) {
  const p = toks(pred), g = toks(gold);
  if (!p.length || !g.length) return p.join(" ") === g.join(" ") ? 1 : 0;
  const c = {}; g.forEach(t => c[t] = (c[t] || 0) + 1);
  let common = 0;
  p.forEach(t => { if (c[t] > 0) { common++; c[t]--; } });
  if (!common) return 0;
  const prec = common / p.length, rec = common / g.length;
  return 2 * prec * rec / (prec + rec);
}

let qi = 0, site = null, page = 0, steps = 0, done = false, log = [];

function spend(action) {
  if (done) return false;
  steps++; log.push(steps + ". " + action);
  if (steps >= MAX && !done) { done = true; log.push("   budget gone"); }
  return true;
}

function go(key) { if (spend("goto_site[" + key + "]")) { site = key; page = 0; } render(); }
function step(d) {
  if (site === null) return;
  const n = SITES.find(s => s.key === site).pages.length;
  const t = page + d;
  if (t < 0 || t >= n) { spend(d > 0 ? "next (refused)" : "prev (refused)"); render(); return; }
  if (spend(d > 0 ? "next" : "prev")) page = t;
  render();
}
function follow(i) {
  const p = SITES.find(s => s.key === site).pages[page];
  const l = p.links[i];
  if (spend("follow[" + (i + 1) + "]")) { site = l.site; page = l.page; }
  render();
}
function answer(text) {
  if (done || !text.trim()) return;
  const q = QUERIES[qi];
  const score = f1(text, q.answer);
  spend("answer[" + text + "]");
  done = true;
  const cls = score >= 0.9 ? "win" : score > 0 ? "part" : "lose";
  const word = score >= 0.9 ? "correct" : score > 0 ? "partly right" : "wrong";
  let why = "";
  if (score < 0.9) {
    why = "<div class='note'>The answer was <b>" + q.answer + "</b>. It sits on a table "
        + "keyed by <b>" + q.key_entity + "</b>, which only the other site could tell you. "
        + "The rows you could have picked instead: " + q.decoys.join(", ") + ".</div>";
  }
  document.getElementById("verdict").innerHTML =
    "<div class='verdict'><span class='big " + cls + "'>" + score.toFixed(3) + "</span> "
    + "<b class='" + cls + "'>" + word + "</b>" + why + "</div>";
  render();
}

function reset(i) {
  qi = i; site = null; page = 0; steps = 0; done = false; log = [];
  document.getElementById("ans").value = "";
  document.getElementById("verdict").innerHTML = "";
  render();
}

function render() {
  const q = QUERIES[qi];
  document.getElementById("question").textContent = q.question;
  const left = MAX - steps;
  const st = document.getElementById("steps");
  st.innerHTML = "actions used <b>" + steps + "</b> of " + MAX
               + (done ? " &middot; episode over" : "");
  st.className = "steps" + (left <= 3 ? " low" : "");

  document.getElementById("tree").innerHTML = SITES.map(s =>
    "<button class='sitebtn" + (s.key === site ? " here" : "") + "' data-go='" + s.key + "'>"
    + s.name + "</button>").join("");

  const pg = document.getElementById("page");
  if (site === null) {
    pg.innerHTML = "<div class='pagetitle'>The portal</div>"
      + "<div class='crumb'>Nothing open yet. Pick a site on the left.</div>"
      + "<div class='body'>" + SITES.map(s =>
          "<p><b>" + s.name + "</b>. " + s.blurb + "</p>").join("") + "</div>";
  } else {
    const s = SITES.find(x => x.key === site), p = s.pages[page];
    pg.innerHTML = "<div class='pagetitle'>" + p.title + "</div>"
      + "<div class='crumb'>" + s.name + " &middot; page " + (page + 1)
      + " of " + s.pages.length + "</div>"
      + "<div class='body'>" + p.body.map(b =>
          "<p class='row'>" + b + "</p>").join("") + "</div>"
      + (p.links.length ? "<div class='links'><h2>Links on this page</h2>"
          + p.links.map((l, i) => "<button data-follow='" + i + "'>" + (i + 1) + ". "
              + l.label + "</button>").join("") + "</div>" : "");
  }

  document.getElementById("prev").disabled = done || site === null || page === 0;
  document.getElementById("next").disabled = done || site === null
      || page === SITES.find(x => x.key === site).pages.length - 1;
  document.getElementById("ans").disabled = done;
  document.getElementById("log").innerHTML = log.map(l => "<div>" + l + "</div>").join("");
}

document.getElementById("qpick").innerHTML =
  QUERIES.map((q, i) => "<option value='" + i + "'>Q" + q.qid + "</option>").join("");
document.getElementById("qpick").onchange = e => reset(+e.target.value);
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.addEventListener("click", e => {
  const g = e.target.dataset && e.target.dataset.go;
  const f = e.target.dataset && e.target.dataset.follow;
  if (g) go(g);
  else if (f !== undefined && f !== "") follow(+f);
});
document.getElementById("ans").addEventListener("keydown", e => {
  if (e.key === "Enter") answer(e.target.value);
});

reset(0);
</script>
